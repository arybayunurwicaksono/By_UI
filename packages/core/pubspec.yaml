name: by_ui
description: A modern, highly customizable Flutter UI component library featuring dynamic border buttons, scroll-driven animations, motion cards, toasts, and shrink-wrap dialogs
version: 0.1.7
homepage: https://github.com/arybayunurwicaksono/By_UI
repository: https://github.com/arybayunurwicaksono/By_UI
issue_tracker: https://github.com/arybayunurwicaksono/By_UI/issues
topics:
  - button
  - sequence
  - card
  - toast
  - dialog

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  sensors_plus: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
